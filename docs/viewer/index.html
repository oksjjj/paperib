<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Anomaly Label Viewer</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <link rel="stylesheet" href="style.css?v=1787738388" />
</head>
<body>
  <header class="top">
    <div>
      <h1>Anomaly Label Viewer</h1>
      <p class="sub">라벨 있는 사업자 · metric 필터 · 줌 / 이동 / 값 탐색 · 라벨 목록</p>
    </div>
    <div class="top-controls">
      <label class="plmn-pick">
        사업자
        <select id="plmn-select"></select>
      </label>
      <div class="view-mode" role="group" aria-label="anomaly 오버레이">
        <button type="button" id="btn-mode-anomaly" class="active" title="그래프에 anomaly 표시">anomaly 표시</button>
        <button type="button" id="btn-mode-plain" title="그래프에서 anomaly 숨김">anomaly 숨김</button>
      </div>
    </div>
  </header>

  <section class="anomaly-bar" aria-label="Anomaly">
    <h2 class="anomaly-title">Anomaly</h2>
    <div class="anomaly-row">
      <select id="label-list" aria-label="anomaly 구간 선택">
        <option value="">anomaly 구간 선택</option>
      </select>
      <button type="button" id="btn-clear-selection" title="라벨 선택 해제">선택 해제</button>
      <button type="button" id="btn-zoom-selected" title="선택한 anomaly 구간으로 줌">선택 구간으로 줌</button>
    </div>
  </section>

  <section class="toolbar">
    <button type="button" id="btn-zoom" class="active" title="드래그로 구간 확대">줌</button>
    <button type="button" id="btn-pan" title="드래그로 이동">이동</button>
    <button type="button" id="btn-inspect" title="클릭·←→로 시점 값 탐색 (드래그 이동 없음)">값 탐색</button>
    <button type="button" id="btn-zoom-in" title="시간축 확대">줌인</button>
    <button type="button" id="btn-zoom-out" title="시간축 축소">줌아웃</button>
    <button type="button" id="btn-reset" title="전체 구간">전체</button>
    <span class="toolbar-sep" aria-hidden="true"></span>
    <button type="button" id="btn-y-in" title="세로축 확대">Y+</button>
    <button type="button" id="btn-y-out" title="세로축 축소">Y-</button>
    <button type="button" id="btn-y-auto" class="active" title="세로축 자동 맞춤">Y 자동</button>
    <span id="status" class="status"></span>
  </section>

  <section class="metric-filter" aria-label="표시 metric">
    <div class="metric-filter-head">
      <strong>표시 metric</strong>
      <button type="button" id="btn-metrics-all" title="모든 metric을 다시 표시">전체 선택</button>
      <button type="button" id="btn-metrics-none" title="모든 metric 숨김 (Y축 스케일 유지)">전체 해제</button>
      <span class="hint-inline">체크 해제하면 숨깁니다 · 화면 합계 내림차순</span>
    </div>
    <div id="metric-filter-list" class="metric-filter-list"></div>
  </section>

  <div id="graph"></div>

  <section class="hover-panel-wrap">
    <h2>이 시점 특성값</h2>
    <p class="hint">
      표시 중인 metric · 값 내림차순.
      <strong>값 탐색</strong>에서 클릭 또는 ←/→.
    </p>
    <div id="hover-panel" class="hover-panel">
      <em>그래프에 커서를 올리세요.</em>
    </div>
  </section>

  <footer class="foot">
    Plotly.js 정적 뷰어 · <code>python labeling/export_viewer.py</code> 로 data/ 갱신
  </footer>

  <script src="app.js?v=1787738388"></script>
</body>
</html>
